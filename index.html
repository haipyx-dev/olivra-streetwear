<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLIVRA | Streetwear</title>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="top-bar">
        <span>FREE SHIPPING ON ORDERS OVER $150</span>
        <span>30-DAY RETURNS</span>
        <span>BUY NOW. PAY LATER WITH AFTERPAY</span>
        <button
          class="top-bar-close"
          type="button"
          aria-label="Close announcement"
        ></button>
      </div>
      <div class="header-container">
        <a href="#" class="logo"> OLIVRA </a>
        <nav class="nav">
          <ul class="nav-list">
            <li><a href="#">NEW ARRIVALS</a></li>
            <li><a href="#">SNEAKERS</a></li>
            <li><a href="#">APPAREL</a></li>
            <li><a href="#">ACCESSORIES</a></li>
            <li><a href="#">BRANDS</a></li>
            <li><a href="#">SALE</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <button class="search-btn" type="button" aria-label="Search"></button>
          <a class="account-link"></a>
          <a class="wishlist-link"></a>
          <a class="cart-link"></a>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="hero"></section>
      <section class="categories"></section>
      <section class="products"></section>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
